{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block body %}
<div class="card" style="max-width:420px;margin:3rem auto">
  <h2>登录</h2>
  <form method="post" class="inline" style="flex-direction:column;align-items:stretch">
    <label>账号<input name="username" autofocus required></label>
    <label>口令<input name="password" type="password" required></label>
    <button>登录</button>
  </form>
  <p class="muted">
    还没有账号？<a href="{{ url_for('auth.signup') }}">自己注册一个</a>（人事审核通过后就能登录），
    或让社长 / 副社长1号在「账号」页面创建。
  </p>
</div>
{% endblock %}
